plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.eurobuddha.pandaapps'
    compileSdk 36

    defaultConfig {
        applicationId "com.eurobuddha.pandaapps"
        minSdk 28
        targetSdk 35
        versionCode 400
        versionName "0.4.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true    // AGP 8 stopped generating BuildConfig by default; DOWNLOAD_ONLY needs it
    }

    // Two editions from one codebase. "full" is PandaApps as it has always been. "pandaget" exists
    // because Play Protect hard-blocks REQUEST_INSTALL_PACKAGES on our young signing key as a
    // dropper: it drops that permission entirely (see src/pandaget/AndroidManifest.xml) and saves
    // the verified APK into the user's Downloads instead of opening the installer.
    flavorDimensions = ["dist"]
    productFlavors {
        full {
            dimension "dist"
            buildConfigField "boolean", "DOWNLOAD_ONLY", "false"
        }
        pandaget {
            dimension "dist"
            applicationId "com.eurobuddha.pandaget"
            minSdk 29           // MediaStore.Downloads — saving needs no storage permission on 29+
            buildConfigField "boolean", "DOWNLOAD_ONLY", "true"
        }
    }
    signingConfigs {
        // Minima family release key. Credentials come from ~/.gradle/gradle.properties
        // (outside every repo), so nothing secret is ever committed. On a machine without
        // those props this config stays empty and release falls back to debug signing.
        release {
            def ksFile = project.findProperty('MINIMA_FAMILY_RELEASE_STORE_FILE')
            if (ksFile != null) {
                storeFile file(ksFile)
                storePassword project.findProperty('MINIMA_FAMILY_RELEASE_STORE_PASSWORD')
                keyAlias project.findProperty('MINIMA_FAMILY_RELEASE_KEY_ALIAS')
                keyPassword project.findProperty('MINIMA_FAMILY_RELEASE_KEY_PASSWORD')
            }
        }
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign release with the debug keystore for sideloading (matches the other companion apps).
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
}
